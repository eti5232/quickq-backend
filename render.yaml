# QuickQ - הגדרת פריסה ל-Render (Blueprint)
# מסד הנתונים נמצא אצל ספק חיצוני (למשל Neon) - מדביקים את כתובת החיבור ב-DATABASE_URL.
services:
  - type: web
    name: quickq-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm run render:build
    # מריץ Migrations, יוצר מנהל על (רק אם הוגדרו משתני SEED) ומפעיל את השרת
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Jerusalem
      - key: CRON_SECRET
        generateValue: true
      - key: REMINDER_INTERVAL_SECONDS
        value: "60"
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SEED_DEMO_PASSWORD
        sync: false
